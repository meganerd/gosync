stages:
  - test
  - build
  - deploy
  - mirror

variables:
  GO_VERSION: "1.25"
  GITHUB_MIRROR_URL: "git@github.com:meganerd/gosync.git"
  GITLAB_MIRROR_PUSH_URL: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test -v -race -count=1 ./...
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:linux:amd64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-linux-amd64 ./cmd/gosync
  artifacts:
    paths:
      - gosync-linux-amd64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:linux:arm64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-linux-arm64 ./cmd/gosync
  artifacts:
    paths:
      - gosync-linux-arm64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:darwin:amd64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-darwin-amd64 ./cmd/gosync
  artifacts:
    paths:
      - gosync-darwin-amd64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:darwin:arm64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-darwin-arm64 ./cmd/gosync
  artifacts:
    paths:
      - gosync-darwin-arm64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:windows:amd64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-windows-amd64.exe ./cmd/gosync
  artifacts:
    paths:
      - gosync-windows-amd64.exe
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:windows:arm64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=windows GOARCH=arm64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-windows-arm64.exe ./cmd/gosync
  artifacts:
    paths:
      - gosync-windows-arm64.exe
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

mirror:github:push:
  stage: mirror
  image: alpine/git:2.49.1
  needs: []
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - test -f "$GITHUB_MIRROR_SSH_KEY"
    - chmod 400 "$GITHUB_MIRROR_SSH_KEY"
    - export GIT_SSH_COMMAND="ssh -i $GITHUB_MIRROR_SSH_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
  script:
    - ./scripts/sync-github-mirror.sh push
  resource_group: github-mirror
  rules:
    - if: $GITHUB_MIRROR_SSH_KEY == null || $GITHUB_MIRROR_SSH_KEY == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

mirror:github:pull-requests:
  stage: mirror
  image: alpine/git:2.49.1
  needs: []
  variables:
    GIT_STRATEGY: fetch
  before_script:
    - test -f "$GITHUB_MIRROR_SSH_KEY"
    - chmod 400 "$GITHUB_MIRROR_SSH_KEY"
    - export GIT_SSH_COMMAND="ssh -i $GITHUB_MIRROR_SSH_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
  script:
    - ./scripts/sync-github-mirror.sh pull-requests
  resource_group: github-mirror
  rules:
    - if: $GITHUB_MIRROR_SSH_KEY == null || $GITHUB_MIRROR_SSH_KEY == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
