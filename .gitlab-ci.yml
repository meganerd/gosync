stages:
  - test
  - build
  - deploy

variables:
  GO_VERSION: "1.25"

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test -v -race -count=1 ./...
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:linux:amd64:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$CI_COMMIT_TAG -X main.commit=$CI_COMMIT_SHORT_SHA" -o gosync-linux-amd64 ./cmd/gosync
  artifacts:
    paths:
      - gosync-linux-amd64
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:linux:arm64:
  stage: build
  image: golang:${GO_VERSION}
  script:
